[pytest]
testpaths = tests
pythonpath = .
# 测试的临时目录落在**仓库里**（`.pytest-tmp/`，已 gitignore），每次跑步开始 pytest
# 会把它清空，所以它不会攒东西。
#
# **不落系统临时目录**：那是用户的地盘，不是这个项目的产物堆。
# 注意这只能走 `addopts`——`basetemp` 不是一个 ini 键，写成键 pytest 会直接报
# 「unknown config option」并拒绝启动（exit 4）。路径相对**你在哪个目录下跑 pytest**。
addopts = --basetemp=.pytest-tmp
